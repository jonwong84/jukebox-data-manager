version: 2.1

jobs:
  build-and-test-grpc:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj"
            dotnet restore "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Grpc/Jukebox.DataManager.Grpc.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Grpc.Test/Jukebox.DataManager.Grpc.Test.csproj"
      - run:
          name: Build
          command: |
            dotnet build "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Grpc/Jukebox.DataManager.Grpc.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Grpc.Test/Jukebox.DataManager.Grpc.Test.csproj" \
              --configuration Release \
              --no-restore
      - run:
          name: Test with coverage
          command: |
            mkdir -p /tmp/workspace
            dotnet test "src/Hosts/Jukebox.DataManager.Grpc.Test/Jukebox.DataManager.Grpc.Test.csproj" \
              --configuration Release \
              --no-restore \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover \
              /p:CoverletOutput="/tmp/workspace/grpc.coverage.opencover.xml"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - grpc.coverage.opencover.xml

  build-and-test-rest:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj"
            dotnet restore "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Rest/Jukebox.DataManager.Rest.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Rest.Test/Jukebox.DataManager.Rest.Test.csproj"
      - run:
          name: Build
          command: |
            dotnet build "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Rest/Jukebox.DataManager.Rest.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Rest.Test/Jukebox.DataManager.Rest.Test.csproj" \
              --configuration Release \
              --no-restore
      - run:
          name: Test with coverage
          command: |
            mkdir -p /tmp/workspace
            dotnet test "src/Hosts/Jukebox.DataManager.Rest.Test/Jukebox.DataManager.Rest.Test.csproj" \
              --configuration Release \
              --no-restore \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover \
              /p:CoverletOutput="/tmp/workspace/rest.coverage.opencover.xml"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - rest.coverage.opencover.xml

  build-and-test-managers:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj"
            dotnet restore "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj"
            dotnet restore "src/Manager/Jukebox.DataManager.Managers.Test/Jukebox.DataManager.Managers.Test.csproj"
      - run:
          name: Build
          command: |
            dotnet build "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Manager/Jukebox.DataManager.Managers.Test/Jukebox.DataManager.Managers.Test.csproj" \
              --configuration Release \
              --no-restore
      - run:
          name: Test with coverage
          command: |
            mkdir -p /tmp/workspace
            dotnet test "src/Manager/Jukebox.DataManager.Managers.Test/Jukebox.DataManager.Managers.Test.csproj" \
              --configuration Release \
              --no-restore \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover \
              /p:CoverletOutput="/tmp/workspace/managers.coverage.opencover.xml"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - managers.coverage.opencover.xml

  # Feature branches only. On main, the release job below resolves (and
  # stamps) the version itself. Also resolves the PR number for sonar-scan,
  # because the .NET SDK image used there has no Python.
  resolve-version:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      # v0.4.0 — pinned to the commit the tag points at (immutable),
      # not the mutable tag itself.
      - run:
          name: Install jw-cicd-tools
          command: pip install git+https://github.com/jonwong84/jw-cicd-tools.git@d2b8915ab74ca83b5e9410181133b99ce56294b4
      - run:
          name: Resolve and persist image version
          command: |
            IMAGE_TAG=$(jw_cicd version resolve --changelog CHANGELOG.md --branch "$CIRCLE_BRANCH")
            echo "Resolved tag: $IMAGE_TAG"
            mkdir -p /tmp/workspace
            echo "$IMAGE_TAG" > /tmp/workspace/version.txt
      - run:
          name: Resolve PR Number
          command: |
            # --token isn't passed explicitly; it defaults to $GITHUB_TOKEN
            # from this job's context.
            set -e
            PR_NUMBER=$(jw_cicd pr resolve --repo jonwong84/jukebox-data-manager --branch "$CIRCLE_BRANCH")
            echo "PR_NUMBER=$PR_NUMBER"
            echo "$PR_NUMBER" > /tmp/workspace/pr_number.txt
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - version.txt
            - pr_number.txt

  sonar-scan:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Install SonarScanner
          command: |
            dotnet tool install --global dotnet-sonarscanner
            export PATH="$PATH:/root/.dotnet/tools"
            echo 'export PATH="$PATH:/root/.dotnet/tools"' >> $BASH_ENV
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj"
            dotnet restore "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Grpc/Jukebox.DataManager.Grpc.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Rest/Jukebox.DataManager.Rest.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Grpc.Test/Jukebox.DataManager.Grpc.Test.csproj"
            dotnet restore "src/Hosts/Jukebox.DataManager.Rest.Test/Jukebox.DataManager.Rest.Test.csproj"
            dotnet restore "src/Manager/Jukebox.DataManager.Managers.Test/Jukebox.DataManager.Managers.Test.csproj"
      - run:
          name: Load PR Number
          command: |
            PR_NUMBER=$(cat /tmp/workspace/pr_number.txt)
            echo "PR_NUMBER=$PR_NUMBER"
            echo "export PR_NUMBER=$PR_NUMBER" >> $BASH_ENV
      - run:
          name: Begin SonarScan
          command: |
            if [ -z "$PR_NUMBER" ]; then
              echo "No open PR found for branch $CIRCLE_BRANCH — skipping Sonar scan"
              circleci-agent step halt
              exit 0
            fi
            dotnet sonarscanner begin \
              /k:"jonwong84_jukebox-data-manager" \
              /o:"jonwong84" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.pullrequest.key="$PR_NUMBER" \
              /d:sonar.pullrequest.branch="$CIRCLE_BRANCH" \
              /d:sonar.pullrequest.base="main" \
              /d:sonar.cs.opencover.reportsPaths="/tmp/workspace/grpc.coverage.opencover.xml,/tmp/workspace/rest.coverage.opencover.xml,/tmp/workspace/managers.coverage.opencover.xml" \
              /d:sonar.tests="src/Hosts/Jukebox.DataManager.Grpc.Test,src/Hosts/Jukebox.DataManager.Rest.Test,src/Manager/Jukebox.DataManager.Managers.Test" \
              /d:sonar.test.inclusions="src/Hosts/Jukebox.DataManager.Grpc.Test/**/*.cs,src/Hosts/Jukebox.DataManager.Rest.Test/**/*.cs,src/Manager/Jukebox.DataManager.Managers.Test/**/*.cs" \
              /d:sonar.exclusions="src/Hosts/Jukebox.DataManager.Grpc/Program.cs,src/Hosts/Jukebox.DataManager.Rest/Program.cs,src/Manager/Jukebox.DataManager.Contracts/DataContracts/**/*.cs,src/Manager/Jukebox.DataManager.Managers/Mapping/AutoMapper/**/*.cs"
      - run:
          name: Build
          command: |
            dotnet build "src/Manager/Jukebox.DataManager.Contracts/Jukebox.DataManager.Contracts.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Manager/Jukebox.DataManager.Managers/Jukebox.DataManager.Managers.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Grpc/Jukebox.DataManager.Grpc.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Rest/Jukebox.DataManager.Rest.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Grpc.Test/Jukebox.DataManager.Grpc.Test.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Hosts/Jukebox.DataManager.Rest.Test/Jukebox.DataManager.Rest.Test.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Manager/Jukebox.DataManager.Managers.Test/Jukebox.DataManager.Managers.Test.csproj" \
              --configuration Release \
              --no-restore
      - run:
          name: End SonarScan
          command: |
            dotnet sonarscanner end \
              /d:sonar.token="$SONAR_TOKEN"

  # main only. Stamps the changelog, commits it with [skip ci], tags it, and
  # pushes both atomically. Writes the released version (or an empty file when
  # there is nothing to release) to the workspace for the publish-*-main jobs.
  # One version and one tag cover both the gRPC and REST images.
  release:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      # v0.4.0 — pinned to the commit the tag points at (immutable),
      # not the mutable tag itself.
      - run:
          name: Install jw-cicd-tools
          command: pip install git+https://github.com/jonwong84/jw-cicd-tools.git@d2b8915ab74ca83b5e9410181133b99ce56294b4
      - run:
          name: Stamp changelog, tag, and push release
          command: |
            git config user.name "CircleCI"
            git config user.email "ci@users.noreply.github.com"
            REPO_URL="https://${GITHUB_TOKEN}@github.com/jonwong84/jukebox-data-manager.git"

            # Empty by default: the publish jobs skip when version.txt is blank.
            mkdir -p /tmp/workspace
            : > /tmp/workspace/version.txt

            # Only the newest commit on main may release. If main has moved
            # past this pipeline's commit, a newer pipeline (whose tree
            # includes these changes) will release them. Releasing from this
            # stale tree would publish images missing the newer code.
            REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$(git rev-parse HEAD)" != "$REMOTE_SHA" ]; then
              echo "main has moved past this commit; a newer pipeline will release. Nothing to do here."
              exit 0
            fi

            # On main this prints the version that will be released, or a
            # blank line when [Unreleased] has no entries.
            VERSION=$(jw_cicd version resolve --changelog CHANGELOG.md --branch "$CIRCLE_BRANCH")
            if [ -z "$VERSION" ]; then
              echo "Nothing to release."
              exit 0
            fi
            echo "Releasing version: $VERSION"

            # Check origin directly rather than a local tag ref. With
            # entries under [Unreleased], an existing tag means something
            # is wrong.
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists on origin, but [Unreleased] still has entries." >&2
              exit 1
            fi

            jw_cicd release stamp --changelog CHANGELOG.md >/dev/null
            git add CHANGELOG.md
            git commit -m "Release v$VERSION [skip ci]"
            git tag -a "v$VERSION" -m "Release v$VERSION"

            # Atomic: the stamp commit and the tag land together or not at
            # all. This is the first step that writes to the remote, so a
            # ruleset rejection leaves nothing tagged or published.
            if git push --atomic "$REPO_URL" HEAD:refs/heads/main "refs/tags/v$VERSION" 2>push_error.log; then
              echo "Released v$VERSION"
              echo "$VERSION" > /tmp/workspace/version.txt
              exit 0
            fi

            # No retry: after a failed push this tree may no longer be the tip
            # of main, and the images must be built from the commit the
            # release was computed from. Fail loudly instead.
            if grep -qE 'GH013|GH006|protected branch|rule violations' push_error.log; then
              echo "Push to main was rejected by a branch rule:" >&2
            else
              echo "Push to main failed (main may have moved since the tip check):" >&2
            fi
            cat push_error.log >&2
            exit 1
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - version.txt

  publish-grpc-image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Determine image tag
          command: |
            IMAGE_TAG=$(cat /tmp/workspace/version.txt)
            # A blank version means the release job found nothing to
            # release (for example a docs-only merge): don't publish.
            if [ -z "$IMAGE_TAG" ]; then
              echo "Nothing to release — skipping image publish"
              circleci-agent step halt
              exit 0
            fi
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "export IMAGE_TAG=$IMAGE_TAG" >> $BASH_ENV
      - run:
          name: Log in to GHCR
          command: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u jonwong84 --password-stdin
      - run:
          name: Build Docker image
          command: |
            DOCKER_BUILDKIT=1 docker build \
              --secret id=github_token,env=GITHUB_TOKEN \
              -f src/Hosts/Jukebox.DataManager.Grpc/Dockerfile \
              -t ghcr.io/jonwong84/jukebox-datamanager-grpc:$IMAGE_TAG \
              .
            # Only tag :latest on main — a feature-branch build must never
            # overwrite the production "latest" pointer.
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              docker tag ghcr.io/jonwong84/jukebox-datamanager-grpc:$IMAGE_TAG \
                ghcr.io/jonwong84/jukebox-datamanager-grpc:latest
            fi
      - run:
          name: Push Docker image
          command: |
            docker push ghcr.io/jonwong84/jukebox-datamanager-grpc:$IMAGE_TAG
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              docker push ghcr.io/jonwong84/jukebox-datamanager-grpc:latest
            fi

  publish-rest-image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Determine image tag
          command: |
            IMAGE_TAG=$(cat /tmp/workspace/version.txt)
            # A blank version means the release job found nothing to
            # release (for example a docs-only merge): don't publish.
            if [ -z "$IMAGE_TAG" ]; then
              echo "Nothing to release — skipping image publish"
              circleci-agent step halt
              exit 0
            fi
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "export IMAGE_TAG=$IMAGE_TAG" >> $BASH_ENV
      - run:
          name: Log in to GHCR
          command: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u jonwong84 --password-stdin
      - run:
          name: Build Docker image
          command: |
            DOCKER_BUILDKIT=1 docker build \
              --secret id=github_token,env=GITHUB_TOKEN \
              -f src/Hosts/Jukebox.DataManager.Rest/Dockerfile \
              -t ghcr.io/jonwong84/jukebox-datamanager-rest:$IMAGE_TAG \
              .
            # Only tag :latest on main — a feature-branch build must never
            # overwrite the production "latest" pointer.
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              docker tag ghcr.io/jonwong84/jukebox-datamanager-rest:$IMAGE_TAG \
                ghcr.io/jonwong84/jukebox-datamanager-rest:latest
            fi
      - run:
          name: Push Docker image
          command: |
            docker push ghcr.io/jonwong84/jukebox-datamanager-rest:$IMAGE_TAG
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              docker push ghcr.io/jonwong84/jukebox-datamanager-rest:latest
            fi

workflows:
  build-test-scan-publish:
    jobs:
      - build-and-test-grpc:
          context: global-v1
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
      - build-and-test-rest:
          context: global-v1
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
      - build-and-test-managers:
          context: global-v1
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
      # Feature branches: resolve a beta version and PR number, scan,
      # publish beta images.
      - resolve-version:
          context: global-v1
          requires:
            - build-and-test-grpc
            - build-and-test-rest
            - build-and-test-managers
          filters:
            branches:
              only:
                - /^feature\/.*/
      - sonar-scan:
          context: global-v1
          requires:
            - build-and-test-grpc
            - build-and-test-rest
            - build-and-test-managers
            - resolve-version
          filters:
            branches:
              only:
                - /^feature\/.*/
      - publish-grpc-image:
          name: publish-grpc-image-branch
          context: global-v1
          requires:
            - resolve-version
          filters:
            branches:
              only:
                - /^feature\/.*/
      - publish-rest-image:
          name: publish-rest-image-branch
          context: global-v1
          requires:
            - resolve-version
          filters:
            branches:
              only:
                - /^feature\/.*/
      # main: release first (stamp, tag, push), then publish both images
      # only if it succeeded.
      - release:
          context: global-v1
          requires:
            - build-and-test-grpc
            - build-and-test-rest
            - build-and-test-managers
          filters:
            branches:
              only:
                - main
      - publish-grpc-image:
          name: publish-grpc-image-main
          context: global-v1
          requires:
            - release
          filters:
            branches:
              only:
                - main
      - publish-rest-image:
          name: publish-rest-image-main
          context: global-v1
          requires:
            - release
          filters:
            branches:
              only:
                - main